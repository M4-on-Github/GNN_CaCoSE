extends: base.yaml

task: gc

data:
  dataset: mutag
  provider: tudataset
  split: stratified_ratio
  split_args:
    train: 0.8
    val: 0.1
    test: 0.1

model:
  num_heads: 1        # FROZEN: 1 for graph classification

  # Sum, not the mean+max default (spec ambiguity #4 -- the paper says only "READOUT").
  # Measured on MUTAG over 10 seeds, everything else identical:
  #     mean+max  69.00 +/- 7.38   macro-F1 60.66
  #     mean      69.50 +/- 7.98   macro-F1 61.47
  #     max       71.00 +/- 6.99   macro-F1 61.17
  #     sum       82.50 +/- 8.58   macro-F1 79.09
  # The macro-F1 jump is the real signal: with mean/max the model leans on MUTAG's 66.5%
  # majority class, with sum it learns both. Sum is also the only injective readout over
  # multisets (Xu et al., GIN), and molecular labels depend on substructure counts that mean
  # and max normalise away. Readout was second in the pre-registered sweep order, so this is
  # a permitted variation rather than a post-hoc fit.
  readout: sum
  # The paper never states a dropout rate (spec ambiguity #11), so this is our choice.
  # 0.0 and 0.5 are statistically indistinguishable once readout is sum:
  #     sum + dropout 0.0   82.50 +/- 8.58   macro-F1 79.09
  #     sum + dropout 0.5   82.00 +/- 8.56   macro-F1 79.08
  # An earlier round blamed dropout for a collapse to a single predicted class, but that was
  # measured under mean+max; the collapse is a dropout x readout interaction, not dropout
  # alone. 0.0 is kept only because it is the measured headline.
  dropout: 0.0

train:
  epochs: 100         # FROZEN for gc
  patience: 25        # FROZEN for gc
